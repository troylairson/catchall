name: Family Board image

on:
  push:
    branches: [main]
    paths: ['family-board/**', '.github/workflows/family-board.yml']
  pull_request:
    paths: ['family-board/**', '.github/workflows/family-board.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: family-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: family-board/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    # Publish only from main; pull requests just run the tests above.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: family-board
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/family-board:latest
            ghcr.io/${{ github.repository_owner }}/family-board:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
