name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/adoring-euler-49gc23]
    paths: ['guitar-coach/**', 'family-board/site/**', 'fraction-pocket/**', 'hive-mind/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guitar-coach/package-lock.json
      - name: Install, test and build
        working-directory: guitar-coach
        run: |
          npm ci
          npm test
          npm run build
      - name: Test Fraction Pocket
        working-directory: fraction-pocket
        run: npm test
      - name: Test Hive Mind
        working-directory: hive-mind
        run: npm test
      - name: Assemble site (app lives under /guitar/)
        run: |
          mkdir -p _site/guitar
          cp -r guitar-coach/dist/. _site/guitar/
          # Family Board's public home and privacy pages (for Google sign-in branding).
          mkdir -p _site/family-board
          cp -r family-board/site/. _site/family-board/
          # Fraction Pocket is static files, no build step.
          mkdir -p _site/fractions
          cp -r fraction-pocket/index.html fraction-pocket/style.css fraction-pocket/manifest.webmanifest fraction-pocket/src fraction-pocket/icons _site/fractions/
          # Hive Mind is static files too.
          mkdir -p _site/hive
          cp -r hive-mind/index.html hive-mind/style.css hive-mind/manifest.webmanifest hive-mind/sw.js hive-mind/src hive-mind/icons _site/hive/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=guitar/">
          <title>catchall</title>
          <a href="guitar/">First Chords — guitar coach</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}guitar/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
