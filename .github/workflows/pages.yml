name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/adoring-euler-49gc23, sports-app]
    paths: ['guitar-coach/**', 'sports-app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            guitar-coach/package-lock.json
            sports-app/package-lock.json
      - name: Guitar coach — install, test and build
        working-directory: guitar-coach
        run: |
          npm ci
          npm test
          npm run build
      - name: Sports scores — install, test and build
        if: hashFiles('sports-app/package.json') != ''
        working-directory: sports-app
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site (/guitar/ and /sports/)
        run: |
          mkdir -p _site/guitar
          cp -r guitar-coach/dist/. _site/guitar/
          if [ -d sports-app/dist ]; then mkdir -p _site/sports && cp -r sports-app/dist/. _site/sports/; fi
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>catchall</title>
          <style>body{font:18px/1.5 system-ui,sans-serif;max-width:32rem;margin:3rem auto;padding:0 1rem}</style>
          <h1>catchall</h1>
          <ul>
            <li><a href="guitar/">First Chords — guitar coach</a></li>
            <li><a href="sports/">Scores — my teams</a></li>
          </ul>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
